# fly.toml app configuration file generated for blood-net on 2026-07-31T14:06:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

# Server + ML deploy: the client (client/) is hosted separately on Vercel.
# The ML availability-prediction service (ml/app.py) runs in the same VM as
# the Node API -- see Dockerfile / docker/start.sh -- reachable only over
# loopback, not exposed as its own Fly service.
# First-time secrets setup:
#   fly secrets set MONGODB_URI=... JWT_SECRET=... ADMIN_EMAIL=... ADMIN_PASSWORD=... \
#     SMTP_USER=... SMTP_PASS=... CLIENT_ORIGIN=https://your-app.vercel.app

app = 'blood-net'
primary_region = 'sin'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  # Bumped from 1gb: the VM now also runs the Flask/XGBoost ML service
  # alongside Node (pandas + numpy + a loaded booster add real headroom).
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048