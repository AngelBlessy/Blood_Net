# fly.toml app configuration file generated for blood-net on 2026-07-31T14:06:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

# Server-only deploy: the client (client/) is hosted separately on Vercel.
# First-time secrets setup:
#   fly secrets set MONGODB_URI=... JWT_SECRET=... ADMIN_EMAIL=... ADMIN_PASSWORD=... \
#     SMTP_USER=... SMTP_PASS=... CLIENT_ORIGIN=https://your-app.vercel.app

app = 'blood-net'
primary_region = 'sin'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
